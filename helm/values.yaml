replicaCount: 2

image:
  repository: mydockerhubuser/webapp
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 5000
  nodePort: 30080

ingress:
  enabled: false
  host: webapp.local

resources: {}

config:
  example_key: "example-value"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

secrets:
  dockerRegistry: dockerhub-secret
  appSecretName: webapp-secrets 
