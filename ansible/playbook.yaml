---
- name: Setup Ubuntu for DevOps (Single Node)
  hosts: webserver
  become: yes
  gather_facts: yes

  vars:
    devops_user: devops
    kube_version: v1.27.4
    kube_bin_path: /usr/local/bin
    ssh_pubkey_path: "/home/andi/.ssh/id_rsa.pub"
    kind_version: v0.26.0
    kind_node_image: kindest/node:v1.34.0
cd ..
  tasks:
    # -------------------------
    # Logging Start
    # -------------------------
    - name: Log start of playbook
      ansible.builtin.debug:
        msg: "🚀 Starting Ubuntu DevOps setup..."

    # -------------------------
    # Update System
    # -------------------------
    - name: Update apt packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist

    - name: Log after apt update
      ansible.builtin.debug:
        msg: "✅ System packages updated."

    # -------------------------
    # Install required packages including Docker
    # -------------------------
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
          - ufw
          - docker.io
        state: present
        update_cache: yes

    - name: Enable Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: yes
        state: started

    - name: Log after installing packages
      ansible.builtin.debug:
        msg: "🐳 Base packages and Docker installed and running."

    # -------------------------
    # Install Kubernetes binaries (kubectl, kubeadm, kubelet)
    # -------------------------
    - name: Download Kubernetes binaries
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kube_version }}/bin/linux/amd64/{{ item }}"
        dest: "{{ kube_bin_path }}/{{ item }}"
        mode: '0755'
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Log Kubernetes binaries installed
      ansible.builtin.debug:
        msg: "✅ Kubernetes binaries installed to {{ kube_bin_path }}."

    # -------------------------
    # Install kind (Kubernetes in Docker)
    # -------------------------
    - name: Download kind binary
      ansible.builtin.get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: "{{ kube_bin_path }}/kind"
        mode: '0755'

    - name: Log kind installation
      ansible.builtin.debug:
        msg: "🐳 Kind v{{ kind_version }} installed successfully."

    - name: Create Kind cluster
      ansible.builtin.shell: >
        kind create cluster --name devops-cluster --image {{ kind_node_image }}
      args:
        creates: /root/.kube/config

    - name: Log Kind cluster creation
      ansible.builtin.debug:
        msg: "✅ Kind single-node cluster 'devops-cluster' created successfully."

    # -------------------------
    # Install Helm via script (idempotent)
    # -------------------------
    - name: Install Helm using official script
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Log Helm installation
      ansible.builtin.debug:
        msg: "⛵ Helm installed successfully."

    # -------------------------
    # Jenkins (Docker container)
    # -------------------------
    - name: Run Jenkins container
      community.docker.docker_container:
        name: jenkins
        image: jenkins/jenkins:lts
        state: started
        restart_policy: always
        published_ports:
          - "8081:8080"
          - "50000:50000"

    - name: Log Jenkins deployment
      ansible.builtin.debug:
        msg: "🧩 Jenkins running in Docker on port 8081."

    # -------------------------
    # Create non-root user and add SSH key
    # -------------------------
    - name: Ensure devops user exists
      ansible.builtin.user:
        name: "{{ devops_user }}"
        groups: sudo,docker
        shell: /bin/bash
        create_home: yes

    - name: Add SSH public key for devops
      ansible.builtin.authorized_key:
        user: "{{ devops_user }}"
        key: "{{ lookup('file', ssh_pubkey_path) }}"

    - name: Log user creation
      ansible.builtin.debug:
        msg: "👤 Non-root user '{{ devops_user }}' created with SSH access."

    # -------------------------
    # Disable swap
    # -------------------------
    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a

    - name: Disable swap permanently in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(.+\\sswap\\s.+)$'
        replace: '# \\1'

    - name: Log after disabling swap
      ansible.builtin.debug:
        msg: "🧠 Swap disabled for Kubernetes."

    # -------------------------
    # Configure UFW firewall
    # -------------------------
    - name: Set default UFW policy to deny incoming
      ansible.builtin.ufw:
        state: enabled
        direction: incoming
        policy: deny

    - name: Allow SSH
      ansible.builtin.ufw:
        rule: allow
        port: 22
        proto: tcp

    - name: Allow HTTP
      ansible.builtin.ufw:
        rule: allow
        port: 80
        proto: tcp

    - name: Allow HTTPS
      ansible.builtin.ufw:
        rule: allow
        port: 443
        proto: tcp

    - name: Allow NodePort range (30000-32767)
      ansible.builtin.ufw:
        rule: allow
        port: 30000:32767
        proto: tcp

    - name: Log UFW configuration
      ansible.builtin.debug:
        msg: "🧱 UFW configured with rules for SSH, HTTP, HTTPS, NodePorts."

    # -------------------------
    # Deploy test NGINX container
    # -------------------------
    - name: Deploy test NGINX container
      community.docker.docker_container:
        name: test-nginx
        image: nginx:latest
        state: started
        restart_policy: always
        published_ports:
          - "8080:80"

    - name: Log after deploying NGINX
      ansible.builtin.debug:
        msg: "🌐 Test NGINX container deployed on port 8080."

    # -------------------------
    # End of Playbook
    # -------------------------
    - name: Log end of playbook
      ansible.builtin.debug:
        msg: "🎯 Ubuntu DevOps setup completed successfully!"
